name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eiap_admin
          POSTGRES_PASSWORD: eiap_ci_secure_password_test_2026
          POSTGRES_DB: business_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit:v1.23
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Generate Synthetic Data Fixtures
        run: |
          python data/generators/seed_generator.py

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://eiap_admin:eiap_ci_secure_password_test_2026@localhost:5432/business_analytics
          LOCAL_DATABASE_URL: postgresql+psycopg://eiap_admin:eiap_ci_secure_password_test_2026@localhost:5432/business_analytics
        run: |
          alembic upgrade head

      - name: Verify Workflow Sanitization (Zero Secrets Check)
        run: |
          python scripts/verify_workflow_sanitization.py

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://eiap_admin:eiap_ci_secure_password_test_2026@localhost:5432/business_analytics
          LOCAL_DATABASE_URL: postgresql+psycopg://eiap_admin:eiap_ci_secure_password_test_2026@localhost:5432/business_analytics
          API_KEY: dev_ci_test_key_32_characters_long_val
        run: |
          pytest -v --junitxml=junit.xml

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

