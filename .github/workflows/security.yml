name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  security-scan:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python Dependencies (pip-audit)
        run: pip-audit -r apps/api/requirements.txt

      - name: Scan Workflows for Secrets
        run: python scripts/verify_workflow_sanitization.py

