[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*BlockingPortal.*:DeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:Warning",
]

